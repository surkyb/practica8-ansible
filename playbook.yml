
---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: true

  tasks:

    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: yes

    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: yes

    - name: Crear carpeta app
      ansible.builtin.file:
        path: /app
        state: directory
        mode: '0755'

    - name: Crear archivo hola.txt
      ansible.builtin.copy:
        dest: /app/hola.txt
        content: "Hola desde Ansible en ITLA\n"
        mode: '0644'

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
        update_cache: yes
